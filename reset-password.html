<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — BTECH SMM</title>
  <link rel="icon" type="image/png" href="assets/brand/icon-32.png" />
  <link rel="apple-touch-icon" href="assets/brand/icon-180.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0A84FF" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>

<body data-page="reset-password" data-nav="marketing">
  <a href="#main" class="skip-link">Skip to content</a>
  <header id="site-header"></header>

  <main id="main">
    <div class="container">
      <div class="card auth-card">
        <div class="auth-card__logo">
          <img src="assets/brand/btech-smm-logo.png" alt="BTECH SMM" />
        </div>
        <h1 class="text-center" style="font-size:var(--fs-xl)">Set a new password</h1>
        <p class="text-center">Choose a new password for your account.</p>

        <form data-reset-form novalidate>
          <p class="form-error" data-form-error role="alert"></p>
          <div class="form-field">
            <label for="reset-password">New password</label>
            <input id="reset-password" name="password" type="password" autocomplete="new-password" required
              minlength="6" />
          </div>
          <div class="form-field">
            <label for="reset-password-confirm">Confirm new password</label>
            <input id="reset-password-confirm" name="passwordConfirm" type="password" autocomplete="new-password"
              required minlength="6" />
          </div>
          <button type="submit" class="btn btn--primary btn--block btn--lg">Reset Password</button>
        </form>

        <p class="auth-switch"><a href="login">Back to login</a></p>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>
  <script type="module" src="js/app.js"></script>
</body>

</html>
