<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Details — BTECH SMM</title>
  <link rel="icon" type="image/png" href="assets/brand/icon-32.png" />
  <link rel="apple-touch-icon" href="assets/brand/icon-180.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0A84FF" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>

<body data-page="order-details" data-nav="customer" data-requires-auth="true">
  <a href="#main" class="skip-link">Skip to content</a>
  <header id="site-header"></header>

  <main id="main">
    <div class="container section--tight section" style="max-width:820px">
      <a href="orders.html" class="link-btn" style="font-size:var(--fs-sm)">&larr; Back to orders</a>
      <div style="margin-top:var(--sp-4)" data-order-details>
        <div class="skeleton" style="height:320px"></div>
      </div>
    </div>
  </main>

  <div class="modal-overlay" data-pay-modal hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="pay-title">
      <div class="modal__head">
        <h3 id="pay-title">Pay with M-Pesa</h3>
        <button class="icon-btn" type="button" data-pay-close aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </div>
      <img src="assets/brand/btech-mpesa-logo.svg" alt="BTECH SMM and M-Pesa" class="payment-partner-logo" />
      <form data-pay-form novalidate>
        <p class="form-error" data-form-error role="alert"></p>
        <p class="form-hint" data-pay-status style="margin-bottom:var(--sp-4)"></p>
        <div class="form-field">
          <label for="pay-phone">M-Pesa phone number</label>
          <input id="pay-phone" name="phone" type="tel" placeholder="07XX XXX XXX" required />
        </div>
        <button type="submit" class="btn btn--primary btn--block" data-pay-submit>Send Payment Request</button>
      </form>
    </div>
  </div>

  <div class="modal-overlay" data-cancel-modal hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="cancel-title">
      <div class="modal__head">
        <h3 id="cancel-title">Cancel this order?</h3>
        <button class="icon-btn" type="button" data-cancel-close aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </div>
      <form data-cancel-form novalidate>
        <p class="form-error" data-form-error role="alert"></p>
        <p class="muted">This sends a cancellation request for review. It isn't cancelled immediately.</p>
        <div class="form-field">
          <label for="cancel-reason">Reason (optional)</label>
          <textarea id="cancel-reason" name="reason" rows="3"
            placeholder="Let us know why you'd like to cancel…"></textarea>
        </div>
        <button type="submit" class="btn btn--primary btn--block">Submit Cancellation Request</button>
      </form>
    </div>
  </div>

  <div class="modal-overlay" data-refund-modal hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="refund-title">
      <div class="modal__head">
        <h3 id="refund-title">Request a refund</h3>
        <button class="icon-btn" type="button" data-refund-close aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </div>
      <form data-refund-form novalidate>
        <p class="form-error" data-form-error role="alert"></p>
        <p class="muted">This sends a refund request to our team for review — it doesn't process a payment
          automatically.</p>
        <div class="form-field">
          <label for="refund-reason">Reason</label>
          <textarea id="refund-reason" name="reason" rows="3" placeholder="Tell us what went wrong…"
            required></textarea>
        </div>
        <button type="submit" class="btn btn--primary btn--block">Submit Refund Request</button>
      </form>
    </div>
  </div>

  <div id="bottom-nav-slot"></div>
  <footer id="site-footer"></footer>
  <script type="module" src="js/app.js"></script>
</body>

</html>
