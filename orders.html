<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orders — BTECH SMM</title>
  <link rel="icon" type="image/png" href="assets/brand/icon-32.png" />
  <link rel="apple-touch-icon" href="assets/brand/icon-180.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0A84FF" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>

<body data-page="orders" data-nav="customer" data-requires-auth="true">
  <a href="#main" class="skip-link">Skip to content</a>
  <header id="site-header"></header>

  <main id="main">
    <div class="container section--tight section">
      <div class="page-head">
        <div>
          <h1>My Orders</h1>
          <p class="muted">Every order you've placed, with live status.</p>
        </div>
        <a href="services.html" class="btn btn--primary">New Order</a>
      </div>

      <div class="filters-bar" style="margin-bottom:var(--sp-4)">
        <div class="filters-bar__search">
          <input type="search" placeholder="Search by order ID or target…" aria-label="Search orders"
            data-orders-search />
        </div>
        <select data-orders-status-filter aria-label="Filter by status">
          <option value="">All statuses</option>
          <option value="pending">Pending</option>
          <option value="processing">Processing</option>
          <option value="completed">Completed</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>

      <div class="table-card">
        <table class="data-table">
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Service</th>
              <th>Platform</th>
              <th>Target</th>
              <th>Quantity</th>
              <th>Amount</th>
              <th>Payment</th>
              <th>Status</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody data-orders-body></tbody>
        </table>
      </div>

      <div class="empty-state" data-orders-empty hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="4" y="4" width="16" height="16" rx="2" />
          <path d="M8 9h8M8 13h8M8 17h5" />
        </svg>
        <h3>No orders yet</h3>
        <p>Once you place an order, it will show up here.</p>
        <a href="services.html" class="btn btn--primary">Browse services</a>
      </div>
    </div>
  </main>

  <div id="bottom-nav-slot"></div>
  <footer id="site-footer"></footer>
  <script type="module" src="js/app.js"></script>
</body>

</html>
