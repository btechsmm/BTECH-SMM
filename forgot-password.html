<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Forgot Password — BTECH SMM</title>
<link rel="icon" type="image/png" href="assets/brand/icon-32.png" />
<link rel="apple-touch-icon" href="assets/brand/icon-180.png" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0A84FF" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/dashboard.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body data-page="forgot-password" data-nav="marketing">
<a href="#main" class="skip-link">Skip to content</a>
<header id="site-header"></header>

<main id="main">
  <div class="container">
    <div class="card auth-card">
      <div class="auth-card__logo">
        <img src="assets/brand/btech-smm-logo.png" alt="BTECH SMM" />
      </div>
      <h1 class="text-center" style="font-size:var(--fs-xl)">Reset your password</h1>
      <p class="text-center">Enter your email and we'll send you reset instructions.</p>

      <p class="form-success" data-form-success hidden>If an account exists for that email, reset instructions have been sent.</p>

      <form data-forgot-form novalidate>
        <p class="form-error" data-form-error role="alert"></p>
        <div class="form-field">
          <label for="forgot-email">Email address</label>
          <input id="forgot-email" name="email" type="email" autocomplete="email" required />
        </div>
        <button type="submit" class="btn btn--primary btn--block btn--lg">Send Reset Instructions</button>
      </form>

      <p class="auth-switch"><a href="login.html">Back to login</a></p>
    </div>
  </div>
</main>

<footer id="site-footer"></footer>
<script type="module" src="js/app.js"></script>
</body>
</html>
