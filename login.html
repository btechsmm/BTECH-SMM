<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — BTECH SMM</title>
  <meta name="description" content="Log in to your BTECH SMM account." />
  <link rel="icon" type="image/png" href="assets/brand/icon-32.png" />
  <link rel="apple-touch-icon" href="assets/brand/icon-180.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0A84FF" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>

<body data-page="login" data-nav="marketing">
  <a href="#main" class="skip-link">Skip to content</a>
  <header id="site-header"></header>

  <main id="main">
    <div class="container">
      <div class="card auth-card">
        <div class="auth-card__logo">
          <img src="assets/brand/btech-smm-logo.png" alt="BTECH SMM" />
        </div>
        <h1 class="text-center" style="font-size:var(--fs-xl)">Welcome back</h1>
        <p class="text-center">Log in to manage your orders and wallet.</p>

        <div class="auth-oauth">
          <button type="button" class="btn btn--google btn--block btn--lg" data-google-btn>
            <svg class="google-g" width="20" height="20" viewBox="0 0 18 18" aria-hidden="true" focusable="false">
              <path fill="#4285F4"
                d="M17.64 9.2045c0-.6381-.0573-1.2518-.1636-1.8409H9v3.4814h4.8436c-.2086 1.125-.8427 2.0782-1.7959 2.7164v2.2581h2.9087c1.7018-1.5668 2.6836-3.874 2.6836-6.615z" />
              <path fill="#34A853"
                d="M9 18c2.43 0 4.4673-.8059 5.9564-2.1805l-2.9087-2.2581c-.8059.54-1.8368.859-3.0477.859-2.3441 0-4.3282-1.5831-5.036-3.7104H.9574v2.3318C2.4382 15.9832 5.4818 18 9 18z" />
              <path fill="#FBBC05"
                d="M3.964 10.71c-.18-.54-.2822-1.1168-.2822-1.71s.1023-1.17.2823-1.71V4.9582H.9573A8.9965 8.9965 0 0 0 0 9c0 1.4523.3477 2.8268.9573 4.0418L3.964 10.71z" />
              <path fill="#EA4335"
                d="M9 3.5795c1.3214 0 2.5077.4541 3.4405 1.346l2.5813-2.5814C13.4632.8918 11.426 0 9 0 5.4818 0 2.4382 2.0168.9573 4.9582L3.964 7.29C4.6718 5.1627 6.6559 3.5795 9 3.5795z" />
            </svg>
            <span>Continue with Google</span>
          </button>
          <p class="form-error" data-google-error role="alert"></p>
          <p class="auth-note">By continuing with Google you agree to the <a href="terms">Terms</a> and <a
              href="privacy">Privacy Policy</a>.</p>
        </div>
        <div class="auth-divider" role="separator"><span>or</span></div>

        <form data-login-form novalidate>
          <p class="form-error" data-form-error role="alert"></p>
          <div class="form-field">
            <label for="login-email">Email address</label>
            <input id="login-email" name="email" type="email" autocomplete="email" required />
          </div>
          <div class="form-field">
            <label for="login-password">Password</label>
            <input id="login-password" name="password" type="password" autocomplete="current-password" required
              minlength="6" />
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--sp-5)">
            <label class="checkbox-row"><input type="checkbox" name="remember" /> Remember me</label>
            <a href="forgot-password" class="link-btn" style="font-size:var(--fs-sm)">Forgot password?</a>
          </div>
          <button type="submit" class="btn btn--primary btn--block btn--lg">Log In</button>
        </form>

        <p class="auth-switch">Don't have an account? <a href="register">Get started</a></p>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>
  <script type="module" src="js/app.js"></script>
</body>

</html>
