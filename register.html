<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create Account — BTECH SMM</title>
<meta name="description" content="Create a free BTECH SMM account to start growing your social presence." />
<link rel="icon" type="image/png" href="assets/brand/icon-32.png" />
<link rel="apple-touch-icon" href="assets/brand/icon-180.png" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0A84FF" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/dashboard.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body data-page="register" data-nav="marketing">
<a href="#main" class="skip-link">Skip to content</a>
<header id="site-header"></header>

<main id="main">
  <div class="container">
    <div class="card auth-card">
      <div class="auth-card__logo">
        <img src="assets/brand/btech-smm-logo.png" alt="BTECH SMM" />
      </div>
      <h1 class="text-center" style="font-size:var(--fs-xl)">Create your account</h1>
      <p class="text-center">Get started with BTECH SMM in under a minute.</p>

      <form data-register-form novalidate>
        <p class="form-error" data-form-error role="alert"></p>
        <div class="form-field">
          <label for="reg-name">Full name</label>
          <input id="reg-name" name="name" type="text" autocomplete="name" required />
        </div>
        <div class="form-field">
          <label for="reg-email">Email address</label>
          <input id="reg-email" name="email" type="email" autocomplete="email" required />
        </div>
        <div class="form-field">
          <label for="reg-password">Password</label>
          <input id="reg-password" name="password" type="password" autocomplete="new-password" required minlength="6" />
          <span class="form-hint">At least 6 characters.</span>
        </div>
        <label class="checkbox-row" style="margin-bottom:var(--sp-5)">
          <input type="checkbox" required /> I agree to the <a href="terms.html" style="color:var(--color-primary)">Terms</a> and <a href="privacy.html" style="color:var(--color-primary)">Privacy Policy</a>
        </label>
        <button type="submit" class="btn btn--primary btn--block btn--lg">Create Account</button>
      </form>

      <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </div>
</main>

<footer id="site-footer"></footer>
<script type="module" src="js/app.js"></script>
</body>
</html>
