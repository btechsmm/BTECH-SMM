<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support — BTECH SMM</title>
  <meta name="description" content="Get help with BTECH SMM: FAQ, contact support and ticket tracking." />
  <link rel="icon" type="image/png" href="assets/brand/icon-32.png" />
  <link rel="apple-touch-icon" href="assets/brand/icon-180.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0A84FF" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>

<body data-page="support" data-nav="customer">
  <a href="#main" class="skip-link">Skip to content</a>
  <header id="site-header"></header>

  <main id="main">
    <div class="container section--tight section">
      <div class="page-head">
        <div>
          <h1>Support</h1>
          <p class="muted">Find answers below, or send us a message.</p>
        </div>
      </div>

      <div class="two-col">
        <div>
          <h3 style="margin-bottom:var(--sp-4)">Frequently asked questions</h3>
          <div data-faq-list></div>
        </div>

        <div>
          <div class="card" style="margin-bottom:var(--sp-6)">
            <h3>Create a support request</h3>
            <form data-ticket-form novalidate>
              <p class="form-error" data-form-error role="alert"></p>
              <div class="form-field">
                <label for="ticket-subject">Subject</label>
                <input id="ticket-subject" name="subject" type="text" required />
              </div>
              <div class="form-field">
                <label for="ticket-message">Message</label>
                <textarea id="ticket-message" name="message" required></textarea>
              </div>
              <button type="submit" class="btn btn--primary btn--block">Submit Request</button>
            </form>
          </div>

          <div class="panel">
            <div class="panel__head">
              <h3>Your tickets</h3>
            </div>
            <div class="panel__body panel__body--padded" data-tickets-list></div>
            <div class="empty-state empty-state--compact" data-tickets-empty hidden>
              <p>You haven't submitted any support requests yet.</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="bottom-nav-slot"></div>

  <footer id="site-footer"></footer>
  <script type="module" src="js/app.js"></script>
</body>

</html>
