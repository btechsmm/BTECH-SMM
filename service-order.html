<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Place Order — BTECH SMM</title>
  <link rel="icon" type="image/png" href="assets/brand/icon-32.png" />
  <link rel="apple-touch-icon" href="assets/brand/icon-180.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0A84FF" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>

<body data-page="service-order" data-nav="customer" data-requires-auth="true">
  <a href="#main" class="skip-link">Skip to content</a>
  <header id="site-header"></header>

  <main id="main">
    <div class="container section--tight section">
      <div class="page-head">
        <div>
          <a href="services" class="link-btn" style="font-size:var(--fs-sm)">&larr; Back to services</a>
          <h1 style="margin-top:var(--sp-2)">Place an order</h1>
        </div>
      </div>

      <div class="order-form-grid">
        <div class="card" data-service-info>
          <div class="skeleton" style="height:220px"></div>
        </div>

        <form class="card" data-order-form novalidate>
          <p class="form-error" data-form-error role="alert"></p>

          <div class="form-field">
            <label for="order-target">Target URL</label>
            <input id="order-target" name="target" type="url" placeholder="https://…" required />
            <span class="form-hint">Link to the profile, post or video this order applies to.</span>
          </div>

          <div class="form-field">
            <label for="order-quantity">Quantity</label>
            <input id="order-quantity" name="quantity" type="number" required />
          </div>

          <div class="order-total-box">
            <span>Total price</span>
            <strong data-total-price>KSh 0</strong>
          </div>

          <div data-loyalty-breakdown></div>

          <div data-wallet-panel></div>

          <button type="submit" class="btn btn--primary btn--block btn--lg">
            Confirm Order
          </button>
          <p class="form-hint" style="margin-top:var(--sp-3);text-align:center">Payment is deducted from your BTECH SMM
            wallet balance.</p>
        </form>
      </div>
    </div>
  </main>

  <div id="bottom-nav-slot"></div>
  <footer id="site-footer"></footer>
  <script type="module" src="js/app.js"></script>
</body>

</html>
